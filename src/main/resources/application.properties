spring.application.name=TP_grupo2
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
google.client.id=${GOOGLE_CLIENT_ID}
facebook.app.id=${FACEBOOK_APP_ID}
facebook.app.secret=${FACEBOOK_APP_SECRET}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.1-flash-lite

# URLs públicas reales (no se pueden inferir de forma confiable detrás del
# proxy de Render). Usadas por el agente de escritorio y el bloqueo remoto.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
